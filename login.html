<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحساب - متجر اللعبة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        /* التبويبات العلوية */
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #334155; }
        .tab-btn {
            flex: 1; padding: 10px; background: none; border: none;
            color: #94a3b8; font-family: inherit; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { color: #10b981; border-bottom: 3px solid #10b981; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-weight: bold; font-size: 0.9rem;}
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a;
            color: #fff; font-family: inherit; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #10b981; }
        
        .submit-btn {
            width: 100%; padding: 12px; margin-top: 10px;
            background: linear-gradient(45deg, #10b981, #059669);
            color: white; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1.1rem;
            transition: 0.3s;
        }
        .submit-btn:disabled { background: #475569; cursor: not-allowed; }
        
        .message { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; font-size: 0.9rem; text-align: center;}
        .msg-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- أزرار التبديل -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="tab-register" onclick="switchMode('register')">حساب جديد</button>
        </div>
        
        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسمك (عربي أو إنجليزي)">
        </div>
        
        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور (6 حروف على الأقل)">
        </div>

        <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">دخول</button>

        <div id="message" class="message"></div>
        
        <a href="index.html" class="back-link">← العودة للمتجر</a>
    </div>

    <script>
        const supabaseUrl = 'https://vcwvtgecyzwnqnyopdrm.supabase.co';
        const supabaseKey = 'sb_publishable_AkujQvSlrG33KuGmpyJhiA_SkClVnRx';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentMode = 'login'; // الوضع الافتراضي

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        const messageBox = document.getElementById('message');

        // دالة تبديل الأزرار
        function switchMode(mode) {
            currentMode = mode;
            messageBox.style.display = 'none'; // إخفاء الرسائل القديمة
            
            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                submitBtn.innerText = 'دخول';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                submitBtn.innerText = 'إنشاء حساب';
            }
        }

        function showMessage(text, isError) {
            messageBox.innerText = text;
            messageBox.className = isError ? 'message msg-error' : 'message msg-success';
            messageBox.style.display = 'block';
        }

        // الخدعة: تحويل الاسم لأي لغة إلى بريد وهمي
        function generateFakeEmail(username) {
            try {
                const encoded = btoa(unescape(encodeURIComponent(username)));
                const safeEncoded = encoded.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                return `${safeEncoded}@game.local`;
            } catch (e) {
                return `user${Date.now()}@game.local`;
            }
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('يرجى ملء جميع الحقول.', true);
                return;
            }
            if (password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', true);
                return;
            }

            const fakeEmail = generateFakeEmail(username);
            submitBtn.innerText = 'جاري المعالجة...';
            submitBtn.disabled = true;

            if (currentMode === 'login') {
                // تسجيل الدخول
                const { error } = await supabase.auth.signInWithPassword({
                    email: fakeEmail, password: password,
                });

                if (error) {
                    showMessage('اسم المستخدم أو كلمة المرور غير صحيحة.', true);
                    submitBtn.innerText = 'دخول';
                    submitBtn.disabled = false;
                } else {
                    showMessage('تم الدخول بنجاح! جاري التحويل...', false);
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            } else {
                // إنشاء حساب جديد
                const { error } = await supabase.auth.signUp({
                    email: fakeEmail, password: password,
                    options: { data: { username: username } }
                });

                if (error) {
                    if (error.message.includes('already registered')) {
                        showMessage('هذا الاسم مستخدم بالفعل، جرب اسماً آخر.', true);
                    } else {
                        showMessage('خطأ: ' + error.message, true);
                    }
                    submitBtn.innerText = 'إنشاء حساب';
                    submitBtn.disabled = false;
                } else {
                    showMessage('تم إنشاء الحساب بنجاح! جاري التحويل...', false);
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            }
        }
    </script>
</body>
    </html>
