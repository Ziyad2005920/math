<style>
  :root {

المهمة: بناء موقع متكامل واحترافي لتعلم الطباعة باللمس — ملف HTML واحد

أنت الآن تعمل بصفتك فريقًا متكاملًا من مهندسي البرمجيات، ومصممي واجهات المستخدم، وخبراء تجربة المستخدم، ومتخصصي تعليم الكتابة باللمس، ومطوري تطبيقات الويب، وخبراء اللغة العربية والطباعة ثنائية اللغة.

مهمتك هي تصميم وبرمجة موقع ويب متكامل لتعلم الطباعة باللمس (Touch Typing)، مع إعطاء اللغة العربية الأولوية القصوى، ودعم اللغة الإنجليزية دعمًا كاملًا، وتوفير جميع الخصائص العملية التي يمكن تنفيذها داخل ملف HTML مستقل.

لا أريد نموذجًا أوليًا أو صفحة تجريبية أو مجرد واجهة جميلة. أريد تطبيقًا حقيقيًا قابلًا للاستخدام، يحتوي على دروس وتمارين واختبارات وتتبع للتقدم وإعدادات وحسابات محلية وأنظمة تدريب متكاملة.

لا تسألني عن التفاصيل الناقصة. اتخذ قرارات تصميمية وهندسية معقولة، ونفّذ أفضل نسخة ممكنة ضمن القيود التالية.

---

1. القيود التقنية الأساسية

أنشئ التطبيق بالكامل في ملف واحد باسم "index.html"، ويحتوي على:

- HTML لبنية الموقع.
- CSS لتصميم الواجهة وجميع المظاهر.
- JavaScript لجميع الوظائف والتفاعلات.
- بيانات الدروس والكلمات والتمارين والاختبارات.
- الرسوم البيانية والعناصر المرئية، باستخدام CSS أو SVG أو Canvas عند الحاجة.

الشروط:

1. يجب أن يعمل الموقع عند فتح الملف مباشرة في المتصفح، دون خادم أو تثبيت برامج.
2. يجب ألا يعتمد على اتصال بالإنترنت أو مكتبات خارجية أو خطوط خارجية أو واجهات API.
3. يجب أن تكون جميع الوظائف الأساسية قابلة للاستخدام دون اتصال بالإنترنت.
4. استخدم "localStorage" لحفظ الإعدادات والتقدم والحسابات المحلية، واستخدم "IndexedDB" عند الحاجة إلى تخزين بيانات أكبر.
5. يجب أن يتعامل التطبيق مع فشل التخزين أو امتلائه بطريقة واضحة، دون انهيار الموقع.
6. لا تستخدم أزرارًا وهمية أو صفحات غير مكتملة أو بيانات إحصائية مزيفة.
7. يجب ألا يؤدي الانتقال بين الأقسام إلى إعادة تحميل الصفحة أو فقدان حالة التدريب.
8. اجعل الكود منظمًا إلى وحدات منطقية داخل الملف نفسه، مع تعليقات مفيدة.
9. يجب ألا يحتاج المستخدم إلى اتصال بالإنترنت حتى يغيّر اللغة أو المظهر أو ينفذ درسًا أو اختبارًا.
10. لا تستخدم "eval" أو تنفيذ الشيفرات النصية المخزنة من المستخدم.
11. استخدم واجهات المتصفح القياسية، مع مراعاة التوافق مع متصفحات Android وChrome وFirefox والحواسيب.
12. إذا كانت هناك خاصية لا يمكن تنفيذها بشكل موثوق في ملف مستقل، فلا تتظاهر بأنها تعمل. نفّذ بديلًا محليًا مناسبًا، واشرح القيد في قسم التوثيق.

الأولوية للتوافق مع الهواتف والحواسيب، مع مراعاة الأجهزة ضعيفة الأداء والذاكرة المحدودة.

لا تضف مكتبات أو خدمات خارجية لمجرد تسهيل العمل.

---

2. الهوية البصرية والتصميم العام

أنشئ تطبيقًا له هوية احترافية مستقلة، وليس شكلًا افتراضيًا أو قالب لوحة تحكم تقليديًا.

أريد واجهة نظيفة وعملية، سهلة الفهم، تقلل التشتيت أثناء التدريب، وتعرض المعلومات المهمة بوضوح.

يجب أن تتضمن الواجهة:

- شريط تنقل واضحًا.
- لوحة رئيسية تعرض تقدم المستخدم.
- مساحة تدريب مركزية كبيرة.
- مؤشرات السرعة والدقة.
- شريط تقدم الدرس.
- اختصارات لوحة المفاتيح.
- نوافذ إعدادات وإحصائيات.
- حالات فارغة ورسائل نجاح وخطأ مفهومة.
- تصميمًا متجاوبًا مع مختلف أحجام الشاشات.
- دعمًا كاملًا لاتجاه الكتابة من اليمين إلى اليسار للعربية، ومن اليسار إلى اليمين للإنجليزية.
- معالجة صحيحة للأرقام وعلامات الترقيم والأقواس داخل النصوص المختلطة.

لا تجعل الواجهة مزدحمة. أخفِ الخيارات المتقدمة داخل قوائم إعدادات مناسبة، مع إبقاء الوظائف الأساسية سهلة الوصول.

المظاهر

أنشئ نظام مظاهر متكاملًا يتضمن على الأقل:

1. فاتح كلاسيكي.
2. داكن كلاسيكي.
3. داكن OLED بخلفية سوداء حقيقية.
4. رمادي داكن.
5. أزرق ليلي.
6. أخضر هادئ.
7. فاتح دافئ.
8. مظهر عالي التباين.
9. مظهر مخصص يسمح بتغيير الألوان الأساسية والخلفية والنصوص.

أضف:

- التحكم بحجم الخط.
- التحكم بتباعد الحروف والأسطر عند الحاجة.
- التحكم بدرجة شفافية العناصر.
- إمكانية تعطيل المؤثرات الحركية.
- إمكانية تفعيل الوضع المريح للعين.
- حفظ المظهر المختار لكل حساب محلي.
- احترام إعدادات تقليل الحركة في نظام التشغيل.

يجب أن يتغير المظهر على مستوى التطبيق كله، لا على صفحة التدريب فقط.

---

3. دعم العربية والإنجليزية

العربية هي اللغة الافتراضية للتطبيق، وهي الأولوية في المحتوى والدروس والتصميم والشرح.

أنشئ نظام ترجمة داخليًا حقيقيًا، لا مجرد زر يغير عنوان الصفحة.

يجب دعم:

- العربية الفصحى.
- الإنجليزية.
- التبديل بين اللغتين في أي وقت.
- حفظ اللغة المفضلة.
- ترجمة القوائم والأزرار ورسائل الخطأ والتعليمات والإحصائيات.
- دعم RTL وLTR بصورة صحيحة.
- التعامل مع النصوص المختلطة دون اضطراب اتجاه علامات الترقيم.
- عرض الكلمات العربية بصورة سليمة.
- التعامل مع التشكيل العربي والحروف المتصلة.
- التمييز بين الحروف الأساسية والتشكيل والرموز.
- عدم اعتبار الحركات العربية أحرفًا مستقلة في إحصاءات سرعة الكتابة إلا وفق إعداد واضح.
- السماح بالتدرب على الأرقام العربية الهندية ١٢٣ والأرقام الغربية 123.
- دعم الفروق بين تخطيطات لوحة المفاتيح.

لا تكتفِ بترجمة الواجهة. أنشئ محتوى تدريبيًا عربيًا أصليًا ومحتوى إنجليزيًا أصليًا.

يجب أن يستطيع المستخدم التدرب بالعربية وحدها، أو الإنجليزية وحدها، أو التبديل بينهما، أو الجمع بينهما في تمارين مخصصة.

---

4. لوحة المفاتيح الافتراضية

أنشئ لوحة مفاتيح مرئية تتغير وفق اللغة والتخطيط المحدد.

يجب أن تتضمن:

- تخطيط QWERTY الإنجليزي.
- تخطيط Arabic 101.
- تخطيط Arabic 102 إذا أمكن تمثيله بدقة.
- خيار تخطيط مخصص عند الإمكان.
- صف الأرقام.
- صفوف الحروف.
- مفاتيح الترقيم والرموز.
- Shift.
- Enter.
- Backspace.
- Tab.
- Space.
- مفاتيح التحكم التي يمكن عرضها بصورة عملية.

لكل مفتاح، اعرض رمزه الأساسي ورمزه البديل عند الضغط على Shift أو وفق التخطيط المحدد.

عند طلب حرف أو رمز، أضئ المفتاح الصحيح، وأظهر الإصبع المقترح لاستخدامه.

لوّن مجموعات المفاتيح بحسب الأصابع:

- الخنصر الأيسر.
- البنصر الأيسر.
- الوسطى اليسرى.
- السبابة اليسرى.
- السبابة اليمنى.
- الوسطى اليمنى.
- البنصر الأيمن.
- الخنصر الأيمن.
- الإبهامان لمفتاح المسافة.

أضف وسيلة إيضاح واضحة لهذه الألوان، مع إمكانية تعطيلها.

أظهر اليد والإصبع المسؤول عن المفتاح التالي، مع دعم وضع عرض مبسط للأجهزة الصغيرة.

لا تدّعِ أن التخطيط الافتراضي يطابق لوحة مفاتيح المستخدم الفعلية دائمًا؛ وفّر إعدادات تسمح باختيار التخطيط الصحيح.

---

5. منهج تعليمي متدرج

أنشئ منهجًا كاملًا يبدأ من الصفر وينتهي بالطباعة المتقدمة.

يجب أن يحتوي على مستويات ووحدات ودروس فعلية قابلة للتنفيذ.

المستوى الأول: التعرف على لوحة المفاتيح

- التعرف على الصفوف.
- التعرف على مواضع المفاتيح.
- موضع اليدين.
- وضعية الجلوس والكتفين والمعصمين.
- مواضع أصابع الارتكاز.
- كيفية استخدام الإبهامين.
- التعرف على المفاتيح الخاصة.
- التعرف على اختلاف تخطيطات لوحات المفاتيح.

المستوى الثاني: تعلم الحروف العربية

قسّم الحروف إلى مجموعات تعليمية مناسبة، مع إعطاء الأولوية لمواضع الأصابع.

- التعرف على المفتاح.
- الضغط على المفتاح الصحيح.
- تكرار الحرف.
- التناوب بين الحروف.
- الانتقال بين الحروف القريبة.
- التمييز بين الحروف المتشابهة.
- تقليل الاعتماد على النظر إلى لوحة المفاتيح.

لا ترتب الحروف العربية أبجديًا فقط؛ اختر ترتيبًا تعليميًا يناسب مواضع الأصابع، ثم قدّم الحروف المتبقية تدريجيًا.

المستوى الثالث: الحروف الإنجليزية

أنشئ منهجًا مستقلًا للإنجليزية يشمل:

- صف الارتكاز.
- الصف العلوي.
- الصف السفلي.
- الانتقالات بين الصفوف.
- الحروف الكبيرة.
- الحروف المتقاربة في مواضع الأصابع.
- الكلمات القصيرة ثم الطويلة.

المستوى الرابع: الحركات والتشكيل

تدرب على:

- الفتحة والضمة والكسرة.
- السكون والشدة.
- التنوين.
- المدود.
- الحروف المشكولة.
- الكلمات التي تحتوي على أكثر من حركة.
- التشكيل باستخدام المفاتيح الفعلية وفق تخطيط المستخدم.

لا تفترض أن جميع تخطيطات لوحات المفاتيح العربية تستخدم مفاتيح التشكيل بالطريقة نفسها.

المستوى الخامس: الكلمات

أنشئ تدريبات على:

- الكلمات القصيرة.
- الكلمات الشائعة.
- الكلمات المتوسطة والطويلة.
- الكلمات التي تحتوي على حروف صعبة.
- الكلمات المتشابهة.
- الكلمات التي تتطلب انتقالات إصبع متتابعة.
- الأسماء والأفعال والحروف.
- المفرد والجمع.
- كلمات من الحياة اليومية.
- كلمات تقنية.
- كلمات رسمية وإدارية.
- كلمات أكاديمية.
- كلمات إنجليزية شائعة.

المستوى السادس: الجمل والفقرات

أنشئ تدريبات تتضمن:

- جملًا قصيرة.
- جملًا متوسطة.
- فقرات طويلة.
- علامات الترقيم.
- المسافات.
- الأقواس.
- علامات الاقتباس.
- الأرقام داخل النصوص.
- نصوصًا عربية واقعية.
- نصوصًا إنجليزية واقعية.
- نصوصًا مختلطة اللغتين.

المستوى السابع: الأرقام والرموز

أنشئ وحدات مستقلة تشمل:

- الأرقام من 0 إلى 9.
- الأرقام العربية الهندية.
- الأرقام الإنجليزية.
- التواريخ.
- الأوقات.
- الكسور.
- العمليات الحسابية.
- العملات.
- النسب المئوية.
- علامات الترقيم.
- الأقواس بأنواعها.
- علامات الاقتباس.
- الشرطات.
- الشرطة المائلة.
- الرموز الشائعة.
- الرموز الموجودة على مفاتيح Shift.
- الرموز البرمجية.
- سلاسل تجمع الأرقام والحروف والرموز.

أنشئ تمارين خاصة لكتابة الرموز مثل:
"@ # $ % ^ & * ( ) _ + - = [ ] { } ; : ' " , . / ? \ | ~"

اعرض هذه الرموز وفق التخطيط المحدد، ولا تفترض أن الضغط على المفتاح نفسه ينتج الرمز نفسه في كل لوحة مفاتيح.

المستوى الثامن: السرعة والطلاقة

- تقليل التوقف بين الكلمات.
- تحسين الانتقال بين الصفوف.
- المحافظة على الدقة مع زيادة السرعة.
- الكتابة دون النظر إلى المفاتيح.
- كتابة فقرات طويلة.
- التعامل مع الكلمات الصعبة.
- التكيف مع النصوص غير المتوقعة.
- تدريبات التحمل.
- اختبارات السرعة المتقدمة.

المستوى التاسع: التدريب المتخصص

أنشئ مسارات اختيارية لـ:

- الطلاب.
- الأعمال المكتبية.
- الكتابة العربية الرسمية.
- الكتابة الإنجليزية.
- المبرمجين.
- إدخال البيانات.
- كتابة الأرقام والجداول.
- الكتابة متعددة اللغات.

كل مسار يجب أن يحتوي على تمارين مناسبة فعلًا، لا مجرد اسم مختلف للمنهج العام.

---

6. محرك التدريب الفعلي

هذه من أهم وظائف الموقع. أنشئ محرك تدريب حقيقيًا، واختبر منطق حساباته.

يجب أن يدعم:

- عرض الحرف أو الكلمة أو الجملة المطلوب كتابتها.
- إدخال النص مباشرة من لوحة المفاتيح الفعلية.
- دعم الكتابة العربية والإنجليزية.
- تمييز الأحرف الصحيحة والخاطئة.
- تحديد موضع الخطأ.
- تحديد الحرف التالي المطلوب.
- متابعة موضع المؤشر بدقة.
- احتساب الأخطاء والتصحيحات.
- التعامل مع Backspace.

استخدم تعريفًا موثقًا لاحتساب WPM. في وضع النصوص العامة يمكن استخدام خمس وحدات كتابية لكل كلمة معيارية، مع عرض طريقة الحساب للمستخدم. لا تخلط بين سرعة الأحرف الخام وسرعة الكلمات المعيارية.

فرّق بين:

- السرعة الإجمالية.
- السرعة الصافية بعد احتساب الأخطاء.
- الدقة على مستوى الأحرف.
- دقة المحاولة النهائية.
- الأخطاء المصححة.
- الأخطاء غير المصححة.

لا تجعل الأخطاء المصححة تختفي من جميع الإحصائيات؛ سجّلها بصورة منفصلة.

لا تعرض سرعة مبالغًا فيها خلال الثواني الأولى من الاختبار. استخدم معالجة مناسبة للمدة القصيرة، ووضّح أن السرعة الأولية قد تكون متقلبة.

احسب النتائج بناءً على البيانات الحقيقية للمحاولة فقط.

12. نظام اكتشاف نقاط الضعف

أنشئ نظامًا محليًا يحلل أخطاء المستخدم ويحدد المهارات التي تحتاج إلى تحسين.

على سبيل المثال:

- إذا تكرر الخطأ في حرف معين، اقترح درسًا يركز عليه.
- إذا انخفضت الدقة عند الانتقال بين الصفوف، أنشئ تمارين انتقالات.
- إذا كانت السرعة جيدة والدقة ضعيفة، أوصِ بتقليل السرعة مؤقتًا.
- إذا كانت الدقة مرتفعة والسرعة منخفضة، اقترح تمارين طلاقة تدريجية.
- إذا كانت الأخطاء مرتبطة بالرموز، اقترح وحدة الرموز.
- إذا كان المستخدم جيدًا بالعربية وضعيفًا بالإنجليزية، اقترح تدريبًا مخصصًا للإنجليزية.
- إذا كان يخطئ في الحروف التي تتطلب الإصبع نفسه، اقترح تدريبًا على التحكم في الإصبع.
- إذا كانت الأخطاء نادرة لكن متكررة في كلمات معينة، أنشئ قائمة تدريب مخصصة.

اجعل التوصيات قائمة على قواعد واضحة قابلة للفهم، وليست ادعاءات بوجود ذكاء اصطناعي فعلي.

اسمح للمستخدم برؤية سبب كل توصية وتجاوزها أو تعديلها.

اجعل إعادة الضبط عملية واضحة تتطلب تأكيدًا مناسبًا.

---

20. دعم الهاتف والحاسوب

على الحاسوب:

- استغلال مساحة الشاشة بذكاء.
- إظهار لوحة المفاتيح الافتراضية عند الحاجة.
- عرض الإحصائيات إلى جانب منطقة التدريب إذا كانت المساحة تسمح.
- عدم إجبار المستخدم على استخدام الفأرة أثناء التدريب.

على الهاتف:

- واجهة عمودية أولًا.
- أزرار واضحة.
- منع التمرير العرضي أثناء الكتابة.
- الحفاظ على منطقة التدريب ظاهرة.
- تجنب تحريك الصفحة مع كل حرف.
- عدم فرض لوحة مفاتيح افتراضية تحجب النص.
- دعم لوحة مفاتيح خارجية متصلة بالهاتف.
- التعامل مع تغيّر حجم الشاشة عند ظهور لوحة مفاتيح الهاتف.
- تقليل الرسوم والعمليات غير الضرورية.

لا تفترض أن كل هاتف يملك لوحة مفاتيح فعلية. إذا كانت لوحة الهاتف الافتراضية تجعل بعض أنواع اختبارات الطباعة باللمس غير مناسبة، وضّح ذلك للمستخدم دون تعطيل بقية الوظائف.

---

21. الاستيراد والتصدير والنسخ الاحتياطي

أنشئ نظامًا عمليًا لنقل بيانات المستخدم.

يجب أن يسمح بتصدير نسخة احتياطية تحتوي على:

- الحسابات المحلية.
- الإعدادات.
- تقدم الدروس.
- الإحصائيات.
- سجل الاختبارات.
- التمارين المخصصة.
- الإنجازات.
- الأهداف.

استخدم JSON منظمًا مع رقم إصدار لمخطط البيانات.

عند الاستيراد:

- تحقق من بنية الملف.
- تحقق من أنواع البيانات.
- ارفض البيانات غير الصالحة.
- لا تنفذ أي محتوى برمجي وارد في الملف.
- اعرض ملخصًا لما سيتم استيراده.
- امنع الكتابة فوق بيانات موجودة دون موافقة.
- تعامل مع اختلاف إصدارات النسخ الاحتياطية قدر الإمكان.

وفّر تصدير CSV لسجل الاختبارات والإحصائيات.

---

22. الأمان والخصوصية

التطبيق محلي في الأساس.

- لا ترسل أي بيانات إلى الإنترنت.
- لا تضف أدوات تتبع.
- لا تضف إعلانات.
- لا تجمع معلومات شخصية غير ضرورية.
- لا تستخدم صلاحيات غير مطلوبة.
- لا تدّعِ وجود تشفير أو حماية لا تنفذها فعليًا.
- اعرض معلومات واضحة حول مكان تخزين البيانات.
- وضّح أن مسح بيانات المتصفح قد يؤدي إلى فقدان التقدم إذا لم توجد نسخة احتياطية.
- لا تستخدم أسماء الحسابات أو النصوص المدخلة لبناء شيفرات قابلة للتنفيذ.
- تعامل بحذر مع ملفات الاستيراد.

أضف صفحة خصوصية مختصرة تشرح حدود التخزين المحلي.

---

23. التعامل مع الأخطاء وحفظ البيانات

يجب ألا ينهار التطبيق إذا:

- لم توجد بيانات محفوظة.
- كانت البيانات المحفوظة غير صالحة.
- امتلأت مساحة التخزين.
- حاول المستخدم استيراد ملف تالف.
- أعاد المستخدم تحميل الصفحة.
- انتقل المستخدم بين الحسابات.
- غيّر اللغة أثناء استخدام التطبيق.
- غيّر المظهر أثناء التدريب.
- ضغط على أزرار متعددة بسرعة.
- انتهت مدة الاختبار أثناء وجود خطأ.
- حاول بدء اختبار جديد قبل انتهاء السابق.

احفظ التقدم في الأوقات المناسبة، دون الكتابة المستمرة إلى التخزين عند كل حرف بطريقة تسبب بطئًا.

استخدم نظامًا واضحًا لإدارة حالة التدريب والمؤقت، ومنع تشغيل مؤقتين للاختبار نفسه.

افصل بين حالة الاختبار الحالية والنتائج المسجلة تاريخيًا.

25. معايير الجودة والاختبار

قبل اعتبار المشروع مكتملًا، اختبر منطقيًا جميع الوظائف الأساسية.

أنشئ قائمة تحقق تشمل:

- فتح الملف مباشرة دون إنترنت.
- بدء درس عربي.

- منع تسجيل نتيجة الاختبار مرتين.

لا تعتبر الوظيفة مكتملة لمجرد وجود زرها في الواجهة.

إذا كانت هناك بيئة اختبار متاحة، استخدمها لاكتشاف أخطاء الشيفرة. لا تدّعِ تشغيل اختبارات لم تُنفذ.

26. ترتيب الأولويات عند ضيق المساحة أو الوقت

إذا لم تتمكن من تنفيذ كل شيء بصورة ممتازة في محاولة واحدة، فاتبع هذا الترتيب:

الأولوية الأولى:
محرك تدريب صحيح، ودعم العربية والإنجليزية، ولوحة المفاتيح، وحساب السرعة والدقة، وحفظ التقدم، وواجهة متجاوبة.

الأولوية الثانية:
منهج متدرج، واختبارات قابلة للتخصيص، وحسابات محلية متعددة، ومظاهر متعددة، وإحصائيات حقيقية.

الأولوية الثالثة:
تحليل الأخطاء، والتوصيات، والإنجازات، والأهداف، ومحرر التمارين، والاستيراد والتصدير.

الأولوية الرابعة:
الخصائص المتقدمة، والرسوم البيانية الإضافية، والتخصيص التفصيلي، والمؤثرات الاختيارية.

لا تضف جميع هذه الخصائص بصورة شكلية على حساب الوظائف الأساسية.

إذا تعارضت ميزة مع الاستقرار أو الأداء، فاختر تنفيذًا أبسط يعمل بصورة صحيحة.

27. تعليمات الإخراج النهائية

أنت مطالب الآن بإنتاج التطبيق نفسه، وليس شرح كيفية بنائه.

أخرج ملف HTML كاملًا واحدًا، يبدأ بإعلان HTML الصحيح وينتهي بإغلاق المستند.

يجب أن يكون الملف مستقلًا، ويتضمن CSS وJavaScript والبيانات الضرورية.

لا تستخدم عبارات مثل:

- «أكمل هذا الجزء لاحقًا».
- «ضع الشيفرة هنا».
- «أضف المحتوى بنفسك».
- «هذه مجرد نسخة أولية».
- «يمكنك تنفيذ هذه الخاصية مستقبلًا».

لا تستبدل الوظائف الفعلية بنصوص توضيحية أو أزرار وهمية.

لا تختصر أجزاء الشيفرة بعبارات مثل «بقية الكود مشابه».

لا تضع جميع المحتويات التدريبية في قائمة صغيرة جدًا ثم تدّعي إنشاء منهج شامل. استخدم محتوى أوليًا غنيًا، مع مولدات تدريب توسّع التنوع بصورة منطقية.

اجعل الكود قابلًا للنسخ والحفظ مباشرة باسم "index.html".

إذا كانت واجهة الإجابة تسمح بإنشاء ملفات فعلية، فأنشئ الملف ليكون قابلًا للتنزيل. وإلا، فأخرج الشيفرة كاملة دون حذف أجزاء منها.

إذا تجاوزت الشيفرة حدود إخراجك، فلا تتوقف بعد إنشاء واجهة غير مكتملة ولا تدّعِ اكتمال المشروع. قل بوضوح إن هناك حدًا لحجم الإخراج، ثم اقسم العمل إلى أجزاء متتابعة تحافظ على استمرارية الشيفرة، مع تحديد موضع الدمج بدقة.

بعد الشيفرة، قدّم ملخصًا موجزًا يوضح:

- الوظائف المنفذة فعلًا.
- الوظائف التي لم تنفذ.
- القيود التي يفرضها العمل داخل ملف HTML مستقل.
- كيفية تشغيل الموقع وحفظه.
- أي مشكلات توافق مع المتصفحات معروفة.

المعيار النهائي للنجاح هو أن يتمكن شخص من فتح الملف والبدء بتعلم الطباعة مباشرة، وأن تكون الوظائف الأساسية حقيقية وقابلة للاستخدام، لا مجرد تصميم يوحي بذلك.
</script>

<script>
(function () {
  var raw = document.getElementById('raw-text').textContent.replace(/^\s+|\s+$/g, '');
  var textBox = document.getElementById('textBox');
  var copyBtn = document.getElementById('copyBtn');
  var toast = document.getElementById('toast');

  textBox.textContent = raw;

  function fallbackCopy(text) {
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {
      ok = false;
    }
    return ok;
  }

  function doCopy() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(raw).then(function () {
        onSuccess();
      }).catch(function () {
        if (fallbackCopy(raw)) onSuccess();
        else onFail();
      });
    } else {
      if (fallbackCopy(raw)) onSuccess();
      else onFail();
    }
  }

  var timer = null;
  function resetBtn() {
    copyBtn.textContent = 'نسخ النص';
    copyBtn.classList.remove('copied');
    toast.classList.remove('show');
  }
  function onSuccess() {
    copyBtn.textContent = 'تم النسخ ✓';
    copyBtn.classList.add('copied');
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(resetBtn, 2200);
  }
  function onFail() {
    copyBtn.textContent = 'تعذّر النسخ';
    clearTimeout(timer);
    timer = setTimeout(resetBtn, 2200);
  }

  copyBtn.addEventListener('click', doCopy);
})();
</script>
