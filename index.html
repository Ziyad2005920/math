<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار مفتوح – أساسيات الرياضيات</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827ee;
      --muted:#94a3b8;
      --text:#e5e7eb;
      --primary:#22c55e;
      --danger:#ef4444;
      --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;background: radial-gradient(1200px 600px at 80% -10%,#0b1228 0%,#0f172a 40%,#0a0f22 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Kufi Arabic", "Noto Sans Arabic", Arial, sans-serif;
      color:var(--text);
      display:flex;align-items:center;justify-content:center;padding:24px
    }
    .app{width:min(980px,100%);}
    .card{background:var(--card);backdrop-filter: blur(8px); border:1px solid #1f2937; border-radius:20px; padding:20px; box-shadow: 0 10px 30px #0007}
    h1{margin:0 0 10px;font-size:clamp(22px,3.5vw,32px);}
    p{color:var(--muted)}
    label{font-size:14px;color:#cbd5e1}
    .ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .op{display:flex;align-items:center;gap:8px;background:#0b1221;border:1px solid #334155;padding:10px 12px;border-radius:14px;cursor:pointer}
    .op input{accent-color:var(--accent)}
    button{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:700}
    .primary{background:var(--primary);color:#052e16}
    .ghost{background:transparent;border:1px solid #334155;color:var(--text)}
    .danger{background:var(--danger);color:#fff}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}
    .timer{font-variant-numeric:tabular-nums;font-weight:800}
    .q-card{margin-top:14px}
    .q-title{font-size:clamp(28px,4vw,36px); font-weight:900; letter-spacing:0.5px}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
    .choice{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid #2b3446;background:#0b1221;color:#ffffff;cursor:pointer;transition:transform .08s ease}
    .choice:hover{transform:translateY(-1px)}
    .kw{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:#0a1530;border:1px solid #2b3446;font-weight:800;color:#93c5fd}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #22304a;padding:10px 8px;text-align:right}
    .ok{color:#22c55e}
    .bad{color:#ef4444}
    .footer{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
    .pill{font-size:12px;border-radius:999px;background:#0b1221;border:1px solid #334155;padding:6px 10px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="app">

    <!-- واجهة البداية -->
    <div class="card" id="setup">
      <h1>اختبار مفتوح – أساسيات الرياضيات</h1>
      <p>اختر العمليات الحسابية التي ترغب في التدريب عليها، ثم اضغط "ابدأ". لا يوجد حد زمني أو عدد أسئلة، ويمكنك إنهاء الاختبار متى شئت.</p>
      <label>العمليات:</label>
      <div class="ops">
        <label class="op"><input type="checkbox" value="+" checked> جمع (+)</label>
        <label class="op"><input type="checkbox" value="-" checked> طرح (−)</label>
        <label class="op"><input type="checkbox" value="*" checked> ضرب (×)</label>
        <label class="op"><input type="checkbox" value="/" checked> قسمة (÷)</label>
        <label class="op"><input type="checkbox" value="^" checked> أس (قوى)</label>
      </div>
      <div class="footer">
        <button class="primary" id="start">ابدأ الاختبار</button>
      </div>
    </div>

    <!-- واجهة الاختبار -->
    <div class="card hidden" id="quiz">
      <div class="toolbar">
        <div style="display:flex;gap:8px;align-items:center">
          <div class="pill"><span id="progress">السؤال 1</span></div>
          <div class="pill timer" id="timer">00:00</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="danger" id="endBtn">إنهاء الاختبار</button>
        </div>
      </div>
      <div class="q-card">
        <div class="q-title" id="question">—</div>
        <div class="choices" id="choices"></div>
      </div>
    </div>

    <!-- واجهة النتيجة -->
    <div class="card hidden" id="result">
      <h1>النتيجة</h1>
      <p id="scoreLine"></p>
      <div style="overflow:auto; max-height:50vh; border:1px solid #22304a; border-radius:12px; padding:6px">
        <table id="review">
          <thead>
            <tr>
              <th>#</th>
              <th>السؤال</th>
              <th>إجابتك</th>
              <th>الإجابة الصحيحة</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="footer">
        <button class="ghost" id="again">اختبار جديد</button>
      </div>
    </div>

  </div>

  <script>
    const letters = ['أ','ب','ت','ث','ج','ح'];
    const state = {
      ops: new Set(['+','-','*','/','^']),
      answers: [],
      elapsed: 0,
      running: false,
      timerId: null
    };

    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const setup = $('#setup');
    const quiz = $('#quiz');
    const result = $('#result');
    const startBtn = $('#start');
    const questionEl = $('#question');
    const choicesEl = $('#choices');
    const progressEl = $('#progress');
    const timerEl = $('#timer');
    const reviewBody = document.querySelector('#review tbody');
    const againBtn = $('#again');
    const endBtn = $('#endBtn');
    const scoreLine = $('#scoreLine');

    function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function pick(arr){return arr[randInt(0,arr.length-1)];}
    function genOperands(op){
      let a,b;
      switch(op){
        case '+': a=randInt(1,99);b=randInt(1,99);return [a,b,a+b];
        case '-': a=randInt(1,99);b=randInt(1,99);if(b>a)[a,b]=[b,a];return [a,b,a-b];
        case '*': a=randInt(2,20);b=randInt(2,12);return [a,b,a*b];
        case '/': b=randInt(2,12);const q=randInt(2,12);a=b*q;return [a,b,q];
        case '^': a=randInt(2,9);b=randInt(2,4);return [a,b,Math.pow(a,b)];
      }
    }
    function fmt(a,b,op){const sym=op==='*'?'×':op==='/'?'÷':op==='^'?'^':op;return `${a} ${sym} ${b} = ؟`; }
    function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
    function genOpts(correct){
      const opts=new Set([correct]);const span=Math.max(1,Math.round(Math.abs(correct)*0.1));
      while(opts.size<6){let d=randInt(1,Math.max(3,span+2));if(Math.random()<0.5)d*=-1;opts.add(correct+d);}
      return shuffle([...opts]);
    }
    function makeQ(){const op=pick([...state.ops]);const [a,b,ans]=genOperands(op);const q=fmt(a,b,op);const options=genOpts(ans);return{q,ans,options};}

    function renderQ(){
      if(!state.running)return;
      const n=state.answers.length+1;
      const Q=makeQ();
      progressEl.textContent=`السؤال ${n}`;
      questionEl.textContent=Q.q;
      choicesEl.innerHTML='';
      Q.options.forEach((v,i)=>{
        const btn=document.createElement('button');
        btn.type='button';btn.className='choice';
        btn.innerHTML=`<span class="kw">${letters[i]}</span><span>${v}</span>`;
        btn.onclick=()=>{select(Q,v)};
        choicesEl.appendChild(btn);
      });
    }
    function select(Q,v){
      if(!state.running)return;
      const correct=v===Q.ans;
      state.answers.push({Q,v,correct});
      renderQ();
    }

    function startTimer(){
      state.elapsed=0;
      timerEl.textContent='00:00';
      state.timerId=setInterval(()=>{
        state.elapsed++;
        const m=String(Math.floor(state.elapsed/60)).padStart(2,'0');
        const s=String(state.elapsed%60).padStart(2,'0');
        timerEl.textContent=`${m}:${s}`;
      },1000);
    }

    function stopTimer(){
      if(state.timerId){clearInterval(state.timerId);state.timerId=null;}
    }

    function finish(){
      state.running=false;
      stopTimer();
      quiz.classList.add('hidden');
      showResult();
      result.classList.remove('hidden');
    }

    function showResult(){
      const correct=state.answers.filter(a=>a.correct).length;
      const wrongs=state.answers.filter(a=>!a.correct);
      const mins=Math.floor(state.elapsed/60);
      const secs=state.elapsed%60;
      scoreLine.innerHTML=`
        ✅ <strong>${correct}</strong> صحيحة /
        ❌ <strong>${wrongs.length}</strong> خاطئة<br>
        🕒 المدة: ${mins} دقيقة و ${secs} ثانية
      `;
      reviewBody.innerHTML='';
      if(wrongs.length===0){
        const tr=document.createElement('tr');
        tr.innerHTML=`<td colspan="4" class="ok">تهانينا، لا توجد أخطاء!</td>`;
        reviewBody.appendChild(tr);
      } else {
        wrongs.forEach((a,i)=>{
          const tr=document.createElement('tr');
          tr.innerHTML=`
            <td>${i+1}</td>
            <td><code>${a.Q.q.replace(' = ؟','')}</code></td>
            <td class="bad">${a.v}</td>
            <td class="ok">${a.Q.ans}</td>
          `;
          reviewBody.appendChild(tr);
        });
      }
    }

    function reset(){
      stopTimer();
      state.answers=[];state.elapsed=0;state.running=false;
      setup.classList.remove('hidden');
      quiz.classList.add('hidden');
      result.classList.add('hidden');
    }

    startBtn.onclick=()=>{
      const ops=$$('.ops input:checked').map(i=>i.value);
      state.ops=new Set(ops.length?ops:['+','-','*','/','^']);
      setup.classList.add('hidden');
      quiz.classList.remove('hidden');
      state.running=true;
      renderQ();
      startTimer();
    };

    endBtn.onclick=finish;
    againBtn.onclick=reset;

    document.addEventListener('DOMContentLoaded',reset);
  </script>
</body>
</html>
