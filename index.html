<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر اللعبة | السوق السري</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* شريط التنقل */
        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .login-btn {
            background: transparent;
            color: #10b981;
            border: 2px solid #10b981;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
        }
        .login-btn:hover { background: #10b981; color: #0f172a; }

        /* العنوان الرئيسي */
        .hero { text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; background: -webkit-linear-gradient(45deg, #10b981, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #94a3b8; font-size: 1.1rem; }

        /* شبكة المنتجات */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* كرت المنتج (زجاجي) */
        .product-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .product-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #10b981, #38bdf8); opacity: 0; transition: opacity 0.3s;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .product-card:hover::before { opacity: 1; }
        
        .product-title { font-size: 1.4rem; color: #38bdf8; margin-bottom: 15px; font-weight: 700; }
        .product-desc { color: #cbd5e1; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; flex-grow: 1; }
        
        .product-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .product-price { font-size: 1.3rem; font-weight: 900; color: #fbbf24; }
        .product-price span { font-size: 0.9rem; color: #94a3b8; font-weight: normal; }
        
        .buy-btn {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .buy-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        /* رسائل الخطأ والتحميل */
        .status-msg { text-align: center; font-size: 1.2rem; color: #94a3b8; grid-column: 1 / -1; padding: 50px; }
        .error-msg { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">السوق السري 🎮</div>
        <button class="login-btn" onclick="window.location.href='login.html'">تسجيل الدخول</button>  
    </nav>

    <header class="hero">
        <h1>متجر اللعبة</h1>
        <p>بوابتك لشراء المعلومات النادرة والأصول بسرية تامة.</p>
    </header>

    <main class="container">
        <div id="products-container" class="products-grid">
            <div class="status-msg">جاري الاتصال بقاعدة البيانات... ⏳</div>
        </div>
    </main>

    <script>
        // إعدادات Supabase
        const supabaseUrl = 'https://vcwvtgecyzwnqnyopdrm.supabase.co';
        const supabaseKey = 'sb_publishable_AkujQvSlrG33KuGmpyJhiA_SkClVnRx';
        
        // محاولة إنشاء الاتصال
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) {
            document.getElementById('products-container').innerHTML = `<div class="error-msg">خطأ في المفتاح: ${e.message}</div>`;
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            
            try {
                // جلب المنتجات
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('is_sold', false);

                if (error) throw error;

                if (!products || products.length === 0) {
                    container.innerHTML = `<div class="status-msg">المتجر فارغ حالياً.. كن أول من يضيف منتجاً!</div>`;
                    return;
                }

                container.innerHTML = ''; 
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    // تنسيق السعر
                    const formattedPrice = new Intl.NumberFormat('ar-EG').format(product.price);

                    card.innerHTML = `
                        <div>
                            <h2 class="product-title">${product.title}</h2>
                            <p class="product-desc">${product.description}</p>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">${formattedPrice} <span>عملة</span></span>
                            <button class="buy-btn" onclick="alert('نظام الشراء يحتاج لتسجيل دخول، سنفعله قريباً!')">شراء الآن</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error-msg">عذراً، حدث خطأ أثناء جلب البيانات: <br> <b>${error.message || error}</b> <br><br>تأكد من إعدادات RLS في Supabase.</div>`;
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        if (supabaseClient) loadProducts();
    </script>
</body>
    </html>
